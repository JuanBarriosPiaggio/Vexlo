version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATA_DIR: /data
    volumes:
      - vexlo_data:/data
    restart: unless-stopped

volumes:
  vexlo_data:
